<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <title>Margin Padding</title>
        <style>
        
            div {
                width: 200px;
                height: 200px;
                display: inline-block;
            }
            /*
                margin:Margin, bir HTML öğesinin sınırlarının dışında kalan boşluktur. Bir kutunun diğer kutularla olan mesafesini belirler.
                margin (m) 0,1,2,3,4,5) m-0, m-1
                margin-right => mr  #Margin-right: bir öğenin sağ kenarı ile onun sağındaki komşusu (diğer bir kutu, yazı veya sayfa kenarı) arasına boşluk koyar.
                margin-left => ml   #Margin-left: bir öğenin sol kenarı ile onun solundaki komşusu (veya sayfa kenarı) arasına boşluk koyar.
                margin-top => mt    #Margin-top: bir öğenin üst kenarı ile onun üzerindeki komşusu (diğer bir kutu, yazı veya sayfanın tavanı) arasına boşluk koyar.
                margin-bottom => mb #Margin-bottom: bir öğenin alt kenarı ile onun altındaki komşusu arasına boşluk koyar.
                
                margin-top, margin-bottom => my #my: sınıfı, bir öğeye aynı anda hem üstten (top) hem de alttan (bottom) dış boşluk (margin) eklemek için kullanılır.
                margin-left, margin-right =>mx #mx- sınıfı, bir öğeye aynı anda hem soldan (start) hem de sağdan (end) dış boşluk (margin) eklemek için kullanılır.
            
                ********************************
                padding:Padding, bir öğenin içeriği (yazı, resim vb.) ile onun kenarlığı (border) arasında kalan boşluktur. Kutunun iç hacmini genişletir
                padding (p) 0,1,2,3,4,5) p-0, p-1
                padding-right => pr #Padding-right:bir öğenin içeriği ile sağ kenarlığı (border) arasındaki mesafedir.
                padding-left => pl  #Padding-left:bir öğenin sol kenarlığı (border) ile içeriği arasındaki boşluktur.
                padding-top => pt   #Padding-top:bir öğenin üst kenarlığı (border) ile içeriği arasındaki boşluktur.
                padding-bottom => pb  #Padding-bottom:bir öğenin içeriği ile alt kenarlığı (border) arasındaki boşluktur.
                
                padding-top, padding-bottom => py #py: sınıfı, bir öğeye aynı anda hem üstten (top) hem de alttan (bottom) iç boşluk (padding) ekler.
                padding-left, padding-right =>px  #px: sınıfı, bir öğeye aynı anda hem soldan (start) hem de sağdan (end) iç boşluk (padding) ekler.   

            
             */
        
        
        </style>        
    </head>

<body>
    

    
    
    
    
    <div class="bg-success py-3">first</div>
    <div class="bg-primary px-5">second</div>


    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script> 
</body>
</html>
